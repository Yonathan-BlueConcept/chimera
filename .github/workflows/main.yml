name: Python Logic Guard
on: [push]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Pytest
        run: pip install pytest

      - name: Run logic tests
        # This command finds all files starting with test_ and runs them
        run: pytest